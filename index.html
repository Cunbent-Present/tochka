<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Точка — салоны и барбершопы России</title>
<meta name="description" content="Карта барбершопов, салонов красоты, маникюра и СПА по всей России с поиском и блокнотом.">
<meta name="theme-color" content="#1B2126">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i></i>Точка</div>
    <div class="bar">
      <button class="city" id="city" type="button" aria-label="Выбрать город">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span id="cityName">Москва</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Барбершоп, маникюр, название, улица…" autocomplete="off" enterkeyhint="search">
        <button class="clear" id="clear" type="button" aria-label="Очистить" hidden>×</button>
      </label>
      <a class="dl" id="dl" href="download.html" aria-label="Скачать приложение">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>
        <span>Скачать</span>
      </a>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <div class="main" id="main">
    <aside class="list" id="list" aria-label="Результаты"></aside>
    <div class="mapwrap">
      <div id="map"></div>
      <div class="status" id="status" hidden></div>
      <button class="listtoggle" id="lt" type="button">Список</button>
      <div class="tools">
        <button id="zin" type="button" aria-label="Приблизить">+</button>
        <button id="zout" type="button" aria-label="Отдалить">−</button>
        <button id="tilt" type="button" aria-label="Переключить 3D" class="tilt">2D</button>
        <button id="loc" type="button" aria-label="Где я">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
      </div>
      <article class="card" id="card" hidden></article>
    </div>
  </div>
</div>

<div class="sheet" id="cp" hidden>
  <div class="sheet-card" role="dialog" aria-label="Выбор города">
    <div class="sheet-h"><h3>Где искать</h3><button class="x" id="cpx" type="button" aria-label="Закрыть">×</button></div>
    <input id="cq" type="search" placeholder="Город, район или адрес" autocomplete="off" enterkeyhint="search">
    <div id="cres"></div>
    <div class="sheet-sub">Крупные города</div>
    <div class="cities" id="clist"></div>
  </div>
</div>

<button class="fab" id="fab" type="button" aria-label="Открыть блокнот">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
  <span class="lbl">Блокнот</span><span class="n" id="cnt">0</span>
</button>

<aside class="note-panel" id="np" aria-label="Блокнот">
  <div class="np-h"><h3>Блокнот</h3><button class="x" id="npx" type="button" aria-label="Закрыть">×</button></div>
  <form class="np-form" id="nf">
    <textarea id="nt" placeholder="Имя, телефон, кому написать и о чём…"></textarea>
    <div class="np-row">
      <button class="btn" type="button" id="copyall">Скопировать все</button>
      <button class="btn pri" type="submit">Сохранить</button>
    </div>
  </form>
  <div class="np-list" id="nl"></div>
</aside>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
