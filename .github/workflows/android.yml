# Собирает Android-приложение (APK) и выкладывает его в Releases.
# Постоянная ссылка на скачивание:
# https://github.com/Cunbent-Present/tochka/releases/latest/download/tochka.apk
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'icons/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Создать Android-проект
        working-directory: native
        run: |
          npm install
          npx cap add android

      - name: Иконка и разрешения
        working-directory: native/android/app/src/main
        run: |
          rm -rf res/mipmap-anydpi-v26
          for d in res/mipmap-*; do
            cp "$GITHUB_WORKSPACE/icons/icon-192.png" "$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/icons/icon-192.png" "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' AndroidManifest.xml

      - name: Собрать APK
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/tochka.apk"

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Точка для Android
          body: |
            Скачайте tochka.apk и откройте файл на телефоне.
            Если Android спросит — разрешите установку из этого источника.
            Приложение открывает актуальную версию Точки, поэтому обновлять APK почти никогда не нужно.
          files: tochka.apk
          make_latest: true
