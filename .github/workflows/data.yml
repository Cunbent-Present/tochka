# Каждый день дособирает базу салонов (каждый регион обновляется раз в неделю) (папка data/) по всем регионам России из OpenStreetMap.
# Запустить вручную: вкладка Actions → «Обновить базу салонов» → Run workflow.
# Один запуск работает до ~4,5 часов; что не успел — обновит следующий (сначала самые старые регионы).
name: Обновить базу салонов

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'   # каждый день в 05:17 по Москве (свежие регионы пропускаются — когда база собрана, запуск занимает минуты)
  push:
    branches: [main]
    paths:
      - 'scripts/build_data.py'
      - '.github/workflows/data.yml'

permissions:
  contents: write
  issues: write      # чтобы один раз написать «вся Россия собрана» (GitHub пришлёт это на почту)

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Настроить git
        run: |
          git config user.name "tochka-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Скачать салоны по регионам
        timeout-minutes: 320
        continue-on-error: true
        env:
          BUDGET_MIN: '270'
          GIT_PUSH: '1'
        run: python scripts/build_data.py

      - name: Сохранить остаток в репозиторий
        if: always()
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "База салонов: обновление $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - name: Сообщить на почту, когда собрана вся Россия
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > summary.txt || exit 0
          import json, sys
          d = json.load(open("data/index.json", encoding="utf-8"))
          if not d.get("complete"):
              sys.exit(1)
          rs = d.get("regions", [])
          print(f"@${{ github.repository_owner }} База Точки собрана по всей России!\n")
          print(f"Регионов: {len(rs)} · заведений: {d.get('total', 0):,}".replace(",", " "))
          print("\nСамые большие регионы:")
          for r in rs[:10]:
              print(f"- {r['name']}: {r['count']}")
          print("\nДальше база обновляется сама: каждый регион раз в неделю.")
          PY
          if gh issue list --state all --label base-complete --json number --jq 'length' | grep -qv '^0$'; then
            echo "Уже сообщали"; exit 0
          fi
          gh label create base-complete --color 2E9D57 --description "База собрана по всей России" 2>/dev/null || true
          gh issue create --title "✅ База Точки собрана по всей России" --body-file summary.txt --label base-complete
