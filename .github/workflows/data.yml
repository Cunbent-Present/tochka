# Раз в неделю обновляет базу салонов (папка data/) по всем регионам России из OpenStreetMap.
# Запустить вручную: вкладка Actions → «Обновить базу салонов» → Run workflow.
# Один запуск работает до ~4,5 часов; что не успел — обновит следующий (сначала самые старые регионы).
name: Обновить базу салонов

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'   # понедельник, 05:17 по Москве
  push:
    branches: [main]
    paths:
      - 'scripts/build_data.py'
      - '.github/workflows/data.yml'

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Настроить git
        run: |
          git config user.name "tochka-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Скачать салоны по регионам
        timeout-minutes: 320
        continue-on-error: true
        env:
          BUDGET_MIN: '270'
          GIT_PUSH: '1'
        run: python scripts/build_data.py

      - name: Сохранить остаток в репозиторий
        if: always()
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "База салонов: обновление $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
